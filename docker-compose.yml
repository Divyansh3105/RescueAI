# Local development stack. It builds the same image Render deploys, so a
# problem shows up here rather than after a push.
#
# Serves http://localhost:3000. That is a secure context in every browser, so
# geolocation and the PWA work locally without TLS. Testing on a real phone
# goes through the deployed HTTPS URL instead.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescueai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rescueai}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rescueai}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rescueai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rescueai}
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
